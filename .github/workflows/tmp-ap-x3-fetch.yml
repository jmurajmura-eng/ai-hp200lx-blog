name: tmp-ap-x3-fetch
on:
  push:
    branches: [tmp-ap-x3-build]
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch IPA official PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ipa
          curl -fL --retry 3 -o ipa/2024_aki_q.pdf 'https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_ap_am_qs.pdf'
          curl -fL --retry 3 -o ipa/2024_aki_a.pdf 'https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06a_ap_am_ans.pdf'
          curl -fL --retry 3 -o ipa/2024_haru_q.pdf 'https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_ap_am_qs.pdf'
          curl -fL --retry 3 -o ipa/2024_haru_a.pdf 'https://www.ipa.go.jp/shiken/mondai-kaiotu/m42obm000000afqx-att/2024r06h_ap_am_ans.pdf'
          curl -fL --retry 3 -o ipa/2023_aki_q.pdf 'https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05a_ap_am_qs.pdf'
          curl -fL --retry 3 -o ipa/2023_aki_a.pdf 'https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05a_ap_am_ans.pdf'
          curl -fL --retry 3 -o ipa/2023_haru_q.pdf 'https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_ap_am_qs.pdf'
          curl -fL --retry 3 -o ipa/2023_haru_a.pdf 'https://www.ipa.go.jp/shiken/mondai-kaiotu/ps6vr70000010d6y-att/2023r05h_ap_am_ans.pdf'
          curl -fL --retry 3 -o ipa/2022_aki_q.pdf 'https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000008smf-att/2022r04a_ap_am_qs.pdf'
          curl -fL --retry 3 -o ipa/2022_aki_a.pdf 'https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000008smf-att/2022r04a_ap_am_ans.pdf'
          curl -fL --retry 3 -o ipa/2022_haru_q.pdf 'https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_ap_am_qs.pdf'
          curl -fL --retry 3 -o ipa/2022_haru_a.pdf 'https://www.ipa.go.jp/shiken/mondai-kaiotu/gmcbt80000009sgk-att/2022r04h_ap_am_ans.pdf'
          sha256sum ipa/* > ipa/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ap-ipa-source
          path: ipa
          retention-days: 1
