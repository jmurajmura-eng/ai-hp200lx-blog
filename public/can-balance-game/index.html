<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>缶を斜めに立てよう！ゲーム版</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#1f2937;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
header{padding:14px 16px;background:#fff;border-bottom:1px solid #d8e0e9}
h1{font-size:22px;margin:0 0 4px}header p{margin:0;color:#64748b;font-size:13px}
main{max-width:980px;margin:auto;padding:14px;display:grid;grid-template-columns:1.25fr .75fr;gap:14px}
.card{background:#fff;border:1px solid #d8e0e9;border-radius:16px;padding:14px;box-shadow:0 4px 16px #0000000b}
canvas{display:block;width:100%;height:auto;border-radius:12px;touch-action:none;background:#dff2ff}
.control{margin-bottom:14px}.control label{display:flex;justify-content:space-between;font-weight:800;margin-bottom:6px}
.control output{color:#1d4ed8}select,input[type=range]{width:100%}
select{font-size:16px;padding:10px;border:1px solid #bcc7d4;border-radius:10px;background:#fff}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{padding:12px;border:0;border-radius:10px;font-weight:800}
.primary{background:#2563eb;color:#fff}.secondary{background:#e8eef7;color:#1e3a8a}
#release{grid-column:1/-1;min-height:66px;font-size:24px;letter-spacing:.04em}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:#f8fafc;border-radius:12px;margin:12px 0;font-weight:800}
.toggle input{width:26px;height:26px}
.status{font-size:20px;font-weight:900;text-align:center;padding:13px;border-radius:12px;margin-top:10px}
.ok{background:#dcfce7;color:#166534}.near{background:#fef3c7;color:#92400e}.ng{background:#fee2e2;color:#991b1b}
.data{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.data div{background:#f8fafc;border-radius:9px;padding:9px;font-size:12px}.data b{display:block;font-size:17px;margin-top:3px}
.small{font-size:12px;line-height:1.55;color:#64748b}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#64748b;margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
@media(max-width:760px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>缶を斜めに立てよう！ゲーム版</h1><p>缶を指で傾け、「手を離す」を押して結果を見よう。</p></header>
<main>
<section class="card">
<canvas id="c" width="760" height="620"></canvas>
<div class="legend">
<span><i class="dot" style="background:#111827"></i>接点</span>
<span id="comLegend" hidden><i class="dot" style="background:#ef4444"></i>重心</span>
<span><i class="dot" style="background:#2563eb"></i>水</span>
</div>
</section>
<aside><section class="card">
<div class="control"><label>缶の種類</label><select id="type"><option value="al350">350ml アルミ缶</option><option value="steel250">250ml スチール缶</option></select></div>
<div class="control"><label>水の量 <output id="waterOut">90ml</output></label><input id="water" type="range" min="0" max="350" step="1" value="90"></div>
<div class="control"><label>開始角度 <output id="angleOut">30.0°</output></label><input id="angle" type="range" min="0" max="65" step="0.1" value="30"></div>
<label class="toggle" for="showCom"><span>重心を表示</span><input id="showCom" type="checkbox"></label>
<div class="buttons"><button id="release" class="primary">手を離す</button><button id="reset" class="secondary">やり直す</button></div>
<div id="status" class="status near">缶を傾けてみよう</div>
<div class="data"><div>現在角度<b id="nowAngle">30.0°</b></div><div>接点とのずれ<b id="offset">非表示</b></div><div>水量<b id="ml">90ml</b></div><div>結果<b id="result">待機中</b></div></div>
<p class="small">重心を隠したまま結果を予想し、あとから「重心を表示」をオンにして答え合わせできます。</p>
</section></aside>
</main>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d'),type=document.getElementById('type'),water=document.getElementById('water'),angle=document.getElementById('angle'),showCom=document.getElementById('showCom');
const cans={al350:{name:'350mlアルミ',cap:350,w:66,h:122,m:14,r:5},steel250:{name:'250mlスチール',cap:250,w:53,h:104,m:24,r:3.5}};
let theta=30*Math.PI/180,omega=0,running=false,drag=false,last=performance.now();
function rot(p,a){let c=Math.cos(a),s=Math.sin(a);return{x:p.x*c-p.y*s,y:p.x*s+p.y*c}}
function area(p){let a=0;for(let i=0,j=p.length-1;i<p.length;j=i++)a+=p[j].x*p[i].y-p[i].x*p[j].y;return a/2}
function centroid(p){let A=area(p),cx=0,cy=0;if(Math.abs(A)<1e-9)return{x:0,y:0};for(let i=0,j=p.length-1;i<p.length;j=i++){let f=p[j].x*p[i].y-p[i].x*p[j].y;cx+=(p[j].x+p[i].x)*f;cy+=(p[j].y+p[i].y)*f}return{x:cx/(6*A),y:cy/(6*A)}}
function clip(p,y){let o=[];for(let i=0;i<p.length;i++){let A=p[i],B=p[(i+1)%p.length],ai=A.y>=y,bi=B.y>=y;if(ai)o.push(A);if(ai!==bi){let t=(y-A.y)/(B.y-A.y);o.push({x:A.x+t*(B.x-A.x),y})}}return o}
function shape(c){let w=c.w/2,h=c.h/2,r=c.r,p=[];function arc(cx,cy,a0,a1){for(let i=0;i<60;i++){let a=a0+(a1-a0)*i/59;p.push({x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)})}}arc(w-r,-h+r,-Math.PI/2,0);arc(w-r,h-r,0,Math.PI/2);arc(-w+r,h-r,Math.PI/2,Math.PI);arc(-w+r,-h+r,Math.PI,1.5*Math.PI);return p}
function geom(){let c=cans[type.value],p=shape(c).map(q=>rot(q,theta)),max=Math.max(...p.map(q=>q.y));p=p.map(q=>({x:q.x,y:q.y-max}));let near=p.filter(q=>q.y>-.08),contact={x:near.reduce((s,q)=>s+q.x,0)/Math.max(near.length,1),y:0};let frac=Math.max(0,Math.min(1,+water.value/c.cap)),wp=[];if(frac>0){let total=Math.abs(area(p)),lo=Math.min(...p.map(q=>q.y)),hi=0;for(let i=0;i<45;i++){let mid=(lo+hi)/2,cp=clip(p,mid),a=cp.length>2?Math.abs(area(cp)):0;if(a/total>frac)lo=mid;else hi=mid}wp=clip(p,(lo+hi)/2)}let shell=centroid(p),wc=wp.length>2?centroid(wp):shell,wm=+water.value,tm=c.m+wm,com={x:(shell.x*c.m+wc.x*wm)/tm,y:(shell.y*c.m+wc.y*wm)/tm};return{c,p,wp,contact,com,offset:com.x-contact.x}}
function path(p,ox,oy,s,fill,stroke,w=1){if(!p.length)return;x.beginPath();x.moveTo(ox+p[0].x*s,oy+p[0].y*s);for(let i=1;i<p.length;i++)x.lineTo(ox+p[i].x*s,oy+p[i].y*s);x.closePath();if(fill){x.fillStyle=fill;x.fill()}if(stroke){x.strokeStyle=stroke;x.lineWidth=w;x.stroke()}}
function draw(){let g=geom(),floor=505,ox=385,s=Math.min(3.45,330/g.c.h);x.clearRect(0,0,760,620);x.fillStyle='#dff2ff';x.fillRect(0,0,760,floor);x.fillStyle='#ddd4c5';x.fillRect(0,floor,760,115);x.strokeStyle='#796b5e';x.lineWidth=5;x.beginPath();x.moveTo(0,floor);x.lineTo(760,floor);x.stroke();path(g.p,ox,floor,s,'rgba(255,255,255,.55)',null);path(g.wp,ox,floor,s,'rgba(37,99,235,.52)',null);path(g.p,ox,floor,s,null,'#475569',5);let px=ox+g.contact.x*s,gx=ox+g.com.x*s,gy=floor+g.com.y*s;x.fillStyle='#111827';x.beginPath();x.arc(px,floor,8,0,7);x.fill();x.font='bold 17px system-ui';x.fillStyle='#111827';x.fillText('接点',px+12,floor-12);
if(showCom.checked){x.fillStyle='#ef4444';x.beginPath();x.arc(gx,gy,9,0,7);x.fill();x.setLineDash([8,7]);x.strokeStyle='#ef4444';x.lineWidth=3;x.beginPath();x.moveTo(gx,gy);x.lineTo(gx,floor);x.stroke();x.setLineDash([]);x.fillStyle='#b91c1c';x.fillText('重心',gx+12,gy-10)}
document.getElementById('nowAngle').textContent=(theta*180/Math.PI).toFixed(1)+'°';document.getElementById('offset').textContent=showCom.checked?g.offset.toFixed(2)+'mm':'非表示';document.getElementById('ml').textContent=water.value+'ml';let st=document.getElementById('status'),res=document.getElementById('result'),a=Math.abs(g.offset);if(!running){st.className='status near';st.textContent='缶を傾けてみよう';res.textContent='待機中'}else if(a<.7&&Math.abs(omega)<.012){st.className='status ok';st.textContent='立った！';res.textContent='成功';running=false}else{st.className='status ng';st.textContent='動いています';res.textContent='判定中'}}
function step(t){let dt=Math.min(.032,(t-last)/1000);last=t;if(running){let g=geom(),torque=g.offset*.0025;omega+=torque*dt*60;omega*=.985;theta+=omega;if(theta<0){theta=0;omega=0;running=false;document.getElementById('result').textContent='まっすぐ立った'}if(theta>Math.PI/2){theta=Math.PI/2;omega=0;running=false;document.getElementById('status').className='status ng';document.getElementById('status').textContent='倒れた';document.getElementById('result').textContent='失敗'}}draw();requestAnimationFrame(step)}
function setAngle(v){theta=Math.max(0,Math.min(Math.PI/2,v));angle.value=(theta*180/Math.PI).toFixed(1);document.getElementById('angleOut').textContent=angle.value+'°';running=false}
angle.oninput=()=>setAngle(+angle.value*Math.PI/180);
water.oninput=()=>{document.getElementById('waterOut').textContent=water.value+'ml';running=false};
type.oninput=()=>{let c=cans[type.value];water.max=c.cap;if(+water.value>c.cap)water.value=Math.round(c.cap*.25);document.getElementById('waterOut').textContent=water.value+'ml';running=false};
showCom.onchange=()=>{document.getElementById('comLegend').hidden=!showCom.checked};
document.getElementById('release').onclick=()=>{running=true;omega=0};
document.getElementById('reset').onclick=()=>setAngle(+angle.value*Math.PI/180);
function pointer(e){let r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*cv.width/r.width;setAngle(Math.atan2(Math.abs(px-cv.width/2),260))}
cv.addEventListener('pointerdown',e=>{drag=true;cv.setPointerCapture(e.pointerId);pointer(e)});
cv.addEventListener('pointermove',e=>{if(drag)pointer(e)});
cv.addEventListener('pointerup',()=>{drag=false});
document.getElementById('waterOut').textContent=water.value+'ml';document.getElementById('angleOut').textContent=angle.value+'°';requestAnimationFrame(step);
</script>
</body></html>
